name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
      # Publie une Release dès que la version de package.json n'en a pas encore.
      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "La Release $VERSION existe déjà."
          else
            gh release create "$VERSION" *.vsix --target "$GITHUB_SHA" --title "Subway Player $VERSION" \
              --notes "Télécharge le fichier .vsix ci-dessous, puis suis les étapes d'installation du README."
          fi
